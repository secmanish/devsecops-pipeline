name: DAST Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP (DAST)
    runs-on: ubuntu-latest
    # The active scan has no duration cap of its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Built from this checkout; `--wait` returns once both healthchecks pass.
      - name: Start stack
        run: docker compose -f security/zap/compose.yaml up --build --wait

      - name: Scan
        uses: zaproxy/action-af@d186d5d9536d0f1380e5eaa58168432fefc8ed6d # v0.3.0
        with:
          plan: security/zap/plan.yaml
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

      - name: Rename report
        if: always()
        run: mv zap.sarif.json zap.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-sarif
          path: zap.sarif
