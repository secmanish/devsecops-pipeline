name: Image Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (Image)
    runs-on: ubuntu-latest
    strategy:
      # Findings in one image should not hide findings in the other.
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      # `run:` blocks never interpolate expressions, so the matrix value is bound
      # here and read as a shell variable. The directory name is also the build
      # context and the image tag.
      IMAGE: ${{ matrix.image }}
      IMAGE_REF: tasklane-${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/trivy.tar.gz" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build image
        run: docker build --tag "$IMAGE_REF" "$IMAGE"

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Two databases, both downloaded at runtime: the vulnerability DB and the
      # misconfiguration checks bundle. Keyed per image because the two matrix
      # jobs run in parallel and would otherwise race to write one key.
      - name: Restore Trivy databases
        id: db-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/policy
          key: trivy-image-${{ matrix.image }}-${{ steps.date.outputs.date }}
          restore-keys: trivy-image-${{ matrix.image }}-

      - name: Update vulnerability DB
        run: trivy image --download-db-only

      # Every severity reaches the artifact; the gate below decides what blocks.
      - name: Scan image
        run: |
          trivy image "$IMAGE_REF" \
            --scanners vuln,secret \
            --image-config-scanners misconfig,secret \
            --skip-db-update \
            --format sarif \
            --output "trivy-image-$IMAGE.sarif"

      # A second pass, because `--severity` filters the report itself and the
      # artifact above keeps every severity. `--ignore-unfixed` narrows the gate
      # to what a rebuild can act on: the base distribution ships CRITICALs with
      # no patched package, and blocking on those would mute the gate rather than
      # harden the image. They stay in the SARIF and in the benchmark below.
      - name: Gate on fixable HIGH and CRITICAL
        run: |
          trivy image "$IMAGE_REF" \
            --scanners vuln,secret \
            --image-config-scanners misconfig,secret \
            --skip-db-update \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1

      # Compliance mapping, reported rather than enforced: a benchmark written
      # for production hosts raises things a lab image should not fail on.
      - name: CIS Docker Benchmark
        if: always()
        run: |
          trivy image "$IMAGE_REF" \
            --compliance docker-cis-1.6.0 \
            --skip-db-update \
            --format json \
            --output "trivy-image-$IMAGE-cis.json"

      # After the scans, not before: the checks bundle arrives with the first
      # misconfiguration scan rather than with `--download-db-only`. `always()`
      # keeps the cache warm when the gate above fails.
      - name: Save Trivy databases
        if: always() && steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/policy
          key: trivy-image-${{ matrix.image }}-${{ steps.date.outputs.date }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-image-${{ matrix.image }}-reports
          path: |
            trivy-image-${{ matrix.image }}.sarif
            trivy-image-${{ matrix.image }}-cis.json
