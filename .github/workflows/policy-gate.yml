name: Policy Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  conftest:
    name: Conftest (policy)
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: 0.70.0
      CONFTEST_SHA256: e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Conftest
        run: |
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o "$RUNNER_TEMP/conftest.tar.gz"
          echo "${CONFTEST_SHA256}  $RUNNER_TEMP/conftest.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/conftest.tar.gz" conftest
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The policy is code, and is tested before it is trusted to gate anything.
      - name: Test policy
        run: conftest verify --policy security/policies

      - name: Check workflows
        run: |
          conftest test .github/workflows \
            --policy security/policies \
            --namespace github.workflows

      - name: Check Dockerfiles
        if: always()
        run: |
          conftest test backend/Dockerfile frontend/Dockerfile \
            --policy security/policies \
            --namespace dockerfile

      - name: Generate SARIF
        if: always()
        run: |
          conftest test .github/workflows \
            --policy security/policies \
            --namespace github.workflows \
            --output sarif --no-fail > conftest.sarif
          conftest test backend/Dockerfile frontend/Dockerfile \
            --policy security/policies \
            --namespace dockerfile \
            --output sarif --no-fail > conftest-dockerfile.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conftest-sarif
          path: conftest*.sarif
