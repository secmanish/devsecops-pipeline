name: SCA Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (SCA)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/trivy.tar.gz" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Get date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore vulnerability DB
        id: db-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Update vulnerability DB
        run: trivy fs . --download-db-only

      # Saved before scanning so the cache is kept even when the gate fails.
      - name: Save vulnerability DB
        if: steps.db-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.date }}

      - name: Scan dependencies
        run: trivy fs . --scanners vuln --skip-db-update --format sarif --output trivy-sca.sarif

      - name: Gate on HIGH and CRITICAL
        run: trivy fs . --scanners vuln --skip-db-update --severity HIGH,CRITICAL --exit-code 1

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-sca-sarif
          path: trivy-sca.sarif
